name: build

on:
  push:
  pull_request:

jobs:
  core:
    name: Protocol core, codecs, service, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test (build.cmd)
        shell: cmd
        run: build.cmd

  utility:
    name: Settings utility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ui/LdacConfig -c Release
      - name: Upload utility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LdacA2dp-Settings-utility
          path: ui/LdacConfig/bin/Release/

  driver:
    name: KMDF driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The runner image has no WDK; take it (with ACX) from NuGet, see driver/Directory.Build.props.
      - name: Restore the WDK from NuGet
        run: nuget restore driver\packages.config -PackagesDirectory driver\packages
      - name: Build (build_driver.cmd Release)
        shell: cmd
        run: build_driver.cmd Release
      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LdacA2dp-Driver
          path: |
            **/*.sys
            **/*.inf
            **/*.cat
            **/*.cer
